name: Publish Docker Images

on:
  push:
    tags:
      - "api@*"
      - "web@*"

jobs:
  api:
    if: startsWith(github.ref, 'refs/tags/api@')
    uses: ./.github/workflows/publish-image.yml
    with:
      app: api
      tag-prefix: api
      package-path: apps/server/package.json
      dockerfile: apps/server/Dockerfile
      image-suffix: api
    secrets: inherit

  web:
    if: startsWith(github.ref, 'refs/tags/web@')
    uses: ./.github/workflows/publish-image.yml
    with:
      app: web
      tag-prefix: web
      package-path: apps/web/package.json
      dockerfile: apps/web/Dockerfile
      image-suffix: web
    secrets: inherit
