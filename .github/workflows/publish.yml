name: Publish Docker Images

on:
  push:
    tags:
      - "api@*"
      - "web@*"

jobs:
  api:
    if: startsWith(github.ref, 'refs/tags/api@')
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      app: api
      package-path: apps/server/package.json
      dockerfile: apps/server/Dockerfile

  web:
    if: startsWith(github.ref, 'refs/tags/web@')
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      app: web
      package-path: apps/web/package.json
      dockerfile: apps/web/Dockerfile
