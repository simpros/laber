name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Check for orphan workspaces
        run: bun run deps:orphans

      - name: Verify toolchain versions
        run: bun run verify:toolchain

      - name: Lint
        run: bun run lint

  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Type-check
        run: bun run check

  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run unit & component tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Upload SPA build for e2e
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build
          retention-days: 1

  test-e2e:
    name: E2E Tests (SQLite)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        # setup-bun unpacks its release with unzip; the Playwright image
        # does not ship it.
        run: apt-get update && apt-get install -y unzip

      - uses: ./.github/actions/setup

      - name: Download SPA build from build job
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install chromium

      - name: Run E2E tests against a temp SQLite DB
        working-directory: apps/web
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker:
    name: Build images (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/server/Dockerfile
            tags: laber-api:ci
          - name: web
            dockerfile: apps/web/Dockerfile
            tags: laber-web:ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same pin source as .github/actions/setup (packageManager via
      # bun-version-file); both images declare ARG BUN_VERSION with no
      # default, so the build needs it passed explicitly.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve Bun version
        id: bun
        run: echo "version=$(bun scripts/bun-version.ts)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tags }}
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
