name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Verify Bun toolchain
        run: |
          BUN=$(bun scripts/bun-version.ts)
          test "$(bun --version)" = "$BUN"
          test "$(bun scripts/bun-version.ts --catalog @types/bun)" = "$BUN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for orphan workspaces
        run: bun run deps:orphans

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build/
          retention-days: 1

  test:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit & component tests
        run: bun run test

  test-e2e:
    name: E2E Tests
    needs: lint-and-check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        # setup-bun unpacks its release with unzip; the Playwright image
        # does not ship it.
        run: apt-get update && apt-get install -y unzip

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/build/

      - name: Run E2E tests
        working-directory: apps/web
        run: PW_DISABLE_TS_ESM=1 bun --bun --env-file=.env.e2e playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
