name: Publish Docker image (reusable)

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      tag-prefix:
        required: true
        type: string
      package-path:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image-suffix:
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & Push ${{ inputs.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/${{ inputs.tag-prefix }}@}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if this is the highest version
        id: latest
        run: |
          CURRENT="${{ steps.version.outputs.version }}"
          HIGHEST=$(git tag -l '${{ inputs.tag-prefix }}@*' | sed 's/^${{ inputs.tag-prefix }}@//' | sort -V | tail -1)
          if [ "$CURRENT" = "$HIGHEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(jq -r '.version' ${{ inputs.package-path }})
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match ${{ inputs.package-path }} version ($PKG_VERSION)"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ inputs.image-suffix }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
