name: Setup repo with Bun
description: Install the packageManager-pinned Bun and project dependencies.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Verify Bun toolchain
      shell: bash
      run: |
        BUN=$(bun scripts/bun-version.ts)
        echo "bun $BUN ($(bun --version))"
        test "$(bun --version)" = "$BUN"
        test "$(bun scripts/bun-version.ts --catalog @types/bun)" = "$BUN"
