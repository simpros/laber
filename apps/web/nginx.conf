# Static SPA + /api reverse proxy to the Elysia backend.
# The API host is fixed at compose time via the `api` service name.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: serve the app shell for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + auth go to the Elysia server. Trailing-slash handling matters:
  # `proxy_pass http://api:3001;` (no URI part) preserves the original
  # `/api/*` path the SPA requests.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    # SSE streams (activity, stack logs) stay open a long time.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Health probe for the static layer.
  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
