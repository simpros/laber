# Static SPA + /api reverse proxy to the Elysia backend.
# The upstream resolves via Docker DNS at request time, so recreating the
# `api` container does not leave nginx with a stale IP.
server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s;
  set $api http://api:3001;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: serve the app shell for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API + auth go to the Elysia server. proxy_pass has no URI part,
  # so the original `/api/*` path the SPA requests is preserved.
  # A variable forces re-resolution instead of caching one IP at load.
  # One prefix block serves both `/api` and `/api/*`.
  location /api {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE streams (activity, stack logs) stay open a long time.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Health probe for the static layer.
  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
